# ci.yml — every-PR gate per verification.md §CI contract.
#
# Scope note (v1, stock ubuntu runners). Everything excluded is excluded for ONE
# documented reason — renderer pinning — rather than to make CI pass:
#
#   * tests/render, tests/stage4/test_g4_section_golden.py and
#     `pnpm --dir web test:e2e` are excluded from the STOCK-runner jobs only:
#     they are renderer-pinned (the golden sidecars assert the exact
#     Mesa/llvmpipe renderer string) and run in the `render goldens (pinned
#     image)` job below, inside the pinned CI container image the Stage S
#     disposition called for — landed 2026-08-28 (docker/ci/Dockerfile,
#     ci-image.yml). The rest of tests/stage4 is not renderer-pinned and runs
#     on stock runners on every PR.
#
# Everything else runs in full — including the bubblewrap sandbox suites and
# the escape probes, which the previous revision of this file excluded via
# `-k "not sandbox and not bwrap"`. Those exclusions are now REMOVED: the
# sandbox is a security gate and must be exercised on every PR. The functional
# render tests inside core/tests (offscreen, palette, tessellate, cameras) also
# run now; only the byte-pinned golden corpus is deferred.
#
# No pull_request_target (mission rule 8): this workflow never runs untrusted
# PR code with repository secrets.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: read is for the `render goldens (pinned image)` job's pull of
  # the private GHCR image — GHCR masks an unauthorized pull as "manifest
  # unknown" (first-execution truth, run 33130222105).
  packages: read

env:
  UV_PYTHON: "3.13"
  NODE_VERSION: "22.19.0"
  # Exact, not floating: the pinned-image job bakes its own pnpm, and a floating
  # "10" let the stock runners drift to 10.34.5 while the image stayed at
  # 10.18.3 — versions that disagree about ERR_PNPM_IGNORED_BUILDS being fatal
  # (run 33190937658). One version everywhere.
  PNPM_VERSION: "10.34.5"

jobs:
  # ---------------------------------------------------------------- static --
  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright opstore core server

  # ------------------------------------------------------------------ docs --
  # G7H: "headless docs build without warnings". The docs are Markdown, so the
  # build is the reference check — every link, repository path and section
  # reference resolves, or the job fails. There is no warning level on purpose.
  # No Node and no system packages: the docs set must build on a bare checkout.
  docs:
    name: docs + license headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: docs build (links, paths, section refs)
        run: uv run python scripts/docs_check.py
      - name: Apache-2.0 headers on the governed file set
        run: uv run python scripts/license_headers.py --check
      # The leaderboard is generated from bench/results/; --check writes nothing
      # and fails if the committed page disagrees with the committed artifacts.
      - name: leaderboard page is current
        run: uv run heph bench leaderboard --check

  # ------------------------------------------------------------ opstore/0a --
  opstore:
    name: opstore + stage0a
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: >
          uv run pytest opstore/tests tests/stage0a -q
          --cov=opstore/src/opstore --cov-fail-under=90

  # ------------------------------------------------------------- core engine --
  core:
    name: core engine
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The sandbox suites need bubblewrap plus unrestricted unprivileged user
      # namespaces (Ubuntu 24.04 restricts them via AppArmor by default). The
      # offscreen renderer needs surfaceless EGL, satisfied by Mesa's software
      # (llvmpipe) driver on GPU-less runners.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: uv run pytest core/tests -q

  # ------------------------------------------------------------- stage gates --
  stage0b:
    name: stage0b adapter gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # test_adapter_no_node.py builds with node absent, which MUST go through
      # the secure executor — bubblewrap is load-bearing for this gate.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: uv run pytest tests/stage0b -q

  stages:
    name: stage gates 1-6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      # tests/render and tests/stage4's renderer-pinned module are deliberately
      # absent — see the scope note at the top.
      - run: >
          uv run pytest
          tests/stage1 tests/stage2 tests/stage2v tests/stage3 tests/stage4 tests/stage6
          --ignore=tests/stage4/test_g4_section_golden.py -q

  # ------------------------------------------------------- stage gates 8A-8D --
  # Gates G8A (ingest), G8B (solid comparison), G8C (assemblies/constraints),
  # G8D (CADGenBench adapter). Same prerequisites as the stage 1-6 job: the
  # ingest/compare/assembly suites build through the secure executor and the
  # 8A/8D end-to-end scenarios drive the FakeModel sidecar.
  stages8:
    name: stage gates 8A-8D
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: >
          uv run pytest
          tests/stage8a tests/stage8b tests/stage8c tests/stage8d -q

  # ------------------------------------------------------- stage gates 9A-9C --
  # Gates G9A (joints/posed evaluation), G9B (motion checks incl. the posed-
  # scene render on the software rasterizer), G9C Tier 1 (couplings + the
  # mechanism corpus graded through the engine path). Same prerequisites as
  # the 8A-8D job; the G9C Tier 3 mechanism-split baseline is archived bench
  # evidence, not a CI clause (KINEMATICS.md §Gates).
  stages9:
    name: stage gates 9A-9C
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: >
          uv run pytest
          tests/stage9a tests/stage9b tests/stage9c -q

  # ------------------------------------------------------- server + bridge --
  server:
    name: server (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # inspect_part/query_snapshot render through surfaceless EGL; the DFM
      # predicates are sandboxed registry content and need bubblewrap.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      # server/tests is ~769 tests / ~15 min unsharded. Split the test FILES
      # round-robin so every file lands in exactly one shard and the union is
      # the whole suite (no -k filtering, so nothing is silently skipped).
      - name: run shard
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            ls server/tests/test_*.py | sort | awk "NR % 3 == ${{ matrix.shard }}"
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "shard ${{ matrix.shard }} matched no test files" >&2
            exit 1
          fi
          printf 'shard %s: %d files\n' "${{ matrix.shard }}" "${#FILES[@]}"
          uv run pytest "${FILES[@]}" -q

  # ------------------------------------------------------------ agent (node) --
  agent-node:
    name: agent (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent typecheck
      - run: pnpm --dir agent lint
      - run: pnpm --dir agent test

  # The web workspace client (INTERFACE.md §3). Its own package and its own
  # lockfile, driven exactly like `agent/` — there is deliberately no
  # repository-root pnpm workspace, because one would hoist `agent/`'s lockfile
  # and every `pnpm --dir agent install --frozen-lockfile` in these workflows.
  #
  # `pnpm --dir web test:e2e` is NOT here: it is the Gate G4 command and runs
  # in the `render goldens (pinned image)` job above, inside the pinned image
  # (INTERFACE.md §14). This job covers the non-renderer half of web/: unit
  # tests, typecheck, lint, build.
  # ------------------------------------------------ renderer-pinned goldens --
  # The pinned CI container image (docker/ci/Dockerfile, built by ci-image.yml,
  # consumed BY DIGEST — a digest bump here is a renderer re-baseline and lands
  # with regenerated goldens). This job is where the renderer-pinned gates
  # actually run: tests/render (G1 goldens), the G4.7 section golden, and the
  # Gate G4 command `pnpm --dir web test:e2e`. Container options collected from
  # first execution (commit f3a4d42): bwrap needs an unmasked /proc
  # (systempaths=unconfined) plus unconfined seccomp/apparmor for user
  # namespaces; pnpm needs CI=true and a store outside the checkout; git needs
  # safe.directory inside the container.
  render-goldens:
    name: render goldens (pinned image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/autonome-research/hephaestus-ci@sha256:94dd58592d531dc6f93a18bb6d0757d553ecea6db29b963c1af38a440d06ce00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --security-opt systempaths=unconfined
        --cap-add SYS_ADMIN
    env:
      CI: "true"
      npm_config_store_dir: /tmp/pnpm-store
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image bakes a pnpm; activate the repo-pinned one so every CI job
      # runs the identical version (see the PNPM_VERSION note above).
      - run: corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: uv run pytest tests/render -q
      - run: uv run pytest tests/stage4/test_g4_section_golden.py -q
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test:e2e

  web-node:
    name: web (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  # ------------------------------------------------------------- stage 7H --
  # The fast half of the Stage 7H suite: sidecar resolution/integrity policy,
  # version coherence, the docs set, the leaderboard page, and the structural
  # assertions over release.yml's lanes (a)-(d). ~6 s.
  #
  # The `slow` half (build every wheel, install into a throwaway venv, spawn the
  # packaged sidecar) is the release matrix's job — release.yml runs it on the
  # built artifact. Running it here too would double every PR's cost to measure
  # a wheel nobody publishes. Deselecting it is therefore deliberate, and the
  # marker name says so.
  stage7h:
    name: stage7h packaging invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      # The resolver tests assert over a real staged sidecar and its manifest,
      # so the bundle has to exist — a bare checkout has none.
      - name: bundle + stage the sidecar
        run: |
          pnpm --dir agent run bundle
          uv run python scripts/stage_sidecar.py
      - run: uv run pytest tests/stage7h -q -m "not slow"
