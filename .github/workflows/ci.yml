# ci.yml — every-PR gate per verification.md §CI contract.
#
# Scope note (v1, stock ubuntu runners). Everything excluded is excluded for ONE
# documented reason — renderer pinning — rather than to make CI pass:
#
#   * tests/render, tests/stage4/test_g4_section_golden.py and
#     `pnpm --dir web test:e2e` are excluded from the STOCK-runner jobs only:
#     they are renderer-pinned (the golden sidecars assert the exact
#     Mesa/llvmpipe renderer string) and run in the `render goldens (pinned
#     image)` job below, inside the pinned CI container image the Stage S
#     disposition called for — landed 2026-08-28 (docker/ci/Dockerfile,
#     ci-image.yml). The rest of tests/stage4 is not renderer-pinned and runs
#     on stock runners on every PR.
#
# Everything else runs in full — including the bubblewrap sandbox suites and
# the escape probes, which the previous revision of this file excluded via
# `-k "not sandbox and not bwrap"`. Those exclusions are now REMOVED: the
# sandbox is a security gate and must be exercised on every PR. The functional
# render tests inside core/tests (offscreen, palette, tessellate, cameras) also
# run now; only the byte-pinned golden corpus is deferred.
#
# No pull_request_target (mission rule 8): this workflow never runs untrusted
# PR code with repository secrets.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: read is for the `render goldens (pinned image)` job's pull of
  # the private GHCR image — GHCR masks an unauthorized pull as "manifest
  # unknown" (first-execution truth, run 33130222105).
  packages: read

env:
  UV_PYTHON: "3.13"
  NODE_VERSION: "22.19.0"
  # Exact, not floating: the pinned-image job bakes its own pnpm, and a floating
  # "10" let the stock runners drift to 10.34.5 while the image stayed at
  # 10.18.3 — versions that disagree about ERR_PNPM_IGNORED_BUILDS being fatal
  # (run 33190937658). One version everywhere.
  PNPM_VERSION: "10.34.5"

jobs:
  # ---------------------------------------------------------------- static --
  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright opstore core server

  # ------------------------------------------------------------------ docs --
  # G7H: "headless docs build without warnings". The docs are Markdown, so the
  # build is the reference check — every link, repository path and section
  # reference resolves, or the job fails. There is no warning level on purpose.
  # No Node and no system packages: the docs set must build on a bare checkout.
  docs:
    name: docs + license headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: docs build (links, paths, section refs)
        run: uv run python scripts/docs_check.py
      - name: Apache-2.0 headers on the governed file set
        run: uv run python scripts/license_headers.py --check
      # The leaderboard is generated from bench/results/; --check writes nothing
      # and fails if the committed page disagrees with the committed artifacts.
      - name: leaderboard page is current
        run: uv run heph bench leaderboard --check

  # ------------------------------------------------------------ opstore/0a --
  opstore:
    name: opstore + stage0a
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: >
          uv run pytest opstore/tests tests/stage0a -q
          --cov=opstore/src/opstore --cov-fail-under=90

  # ------------------------------------------------------------- core engine --
  core:
    name: core engine
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The sandbox suites need bubblewrap plus unrestricted unprivileged user
      # namespaces (Ubuntu 24.04 restricts them via AppArmor by default). The
      # offscreen renderer needs surfaceless EGL, satisfied by Mesa's software
      # (llvmpipe) driver on GPU-less runners.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: uv run pytest core/tests -q

  # ------------------------------------------------------------- stage gates --
  stage0b:
    name: stage0b adapter gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # test_adapter_no_node.py builds with node absent, which MUST go through
      # the secure executor — bubblewrap is load-bearing for this gate.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: uv run pytest tests/stage0b -q

  stages:
    name: stage gates 1-6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      # tests/render and tests/stage4's renderer-pinned module are deliberately
      # absent — see the scope note at the top.
      - run: >
          uv run pytest
          tests/stage1 tests/stage2 tests/stage2v tests/stage3 tests/stage4 tests/stage6
          --ignore=tests/stage4/test_g4_section_golden.py -q

  # ------------------------------------------------------- stage gates 8A-8D --
  # Gates G8A (ingest), G8B (solid comparison), G8C (assemblies/constraints),
  # G8D (CADGenBench adapter). Same prerequisites as the stage 1-6 job: the
  # ingest/compare/assembly suites build through the secure executor and the
  # 8A/8D end-to-end scenarios drive the FakeModel sidecar.
  stages8:
    name: stage gates 8A-8D
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: >
          uv run pytest
          tests/stage8a tests/stage8b tests/stage8c tests/stage8d -q

  # ------------------------------------------------------- stage gates 9A-9C --
  # Gates G9A (joints/posed evaluation), G9B (motion checks incl. the posed-
  # scene render on the software rasterizer), G9C Tier 1 (couplings + the
  # mechanism corpus graded through the engine path). Same prerequisites as
  # the 8A-8D job; the G9C Tier 3 mechanism-split baseline is archived bench
  # evidence, not a CI clause (KINEMATICS.md §Gates).
  stages9:
    name: stage gates 9A-9C
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      - run: >
          uv run pytest
          tests/stage9a tests/stage9b tests/stage9c -q

  # ---------------------------------------------------- stage gates 11A-11C --
  # Gates G11A (the component record), G11B (mounting interfaces as tagged
  # geometry), G11C Tier 1 (provenance, federation, the component corpus) —
  # PARTS_STORE.md §Gates. Mission rule 1: gates are commands, so all three
  # Tier-1 suites run on every PR here rather than on a developer's machine.
  #
  # Prerequisites, and why each one: bubblewrap plus unrestricted unprivileged
  # user namespaces for G11A's runtime-sandbox refusal against a component
  # generator's body region, and the Mesa software stack for the corpus tasks
  # G11C clause 11 grades through the engine path. No Node: the contract-drift
  # clauses compare the committed agent/src/tools/schema.gen.ts against the
  # generator's output in-process, and nothing in these suites spawns the
  # bridge — a prerequisite this lane does not need is noise, not safety.
  #
  # G11C clause 12's Tier 3 component-family baseline is archived bench
  # evidence, not a CI clause, exactly as the G9C mechanism-split baseline
  # above is (PARTS_STORE.md Gate G11C clause 12, "the measurement").
  stages11:
    name: stage gates 11A-11C
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: >
          uv run pytest
          tests/stage11a tests/stage11b tests/stage11c -q

  # ----------------------------------------------------- stage gates 12A-12B --
  # Gates G12A (admission, canonicalization, facts) and G12B (mesh -> B-rep,
  # sections, the socket path) — MESH_INGEST.md §Gates. Mission rule 1 makes a
  # gate a command, so both suites run on every PR here rather than on a
  # developer's machine. 12C joins this lane with the machinery it gates; a
  # lane naming a suite that does not exist is a red build, not a placeholder.
  #
  # Prerequisites, and why each one: bubblewrap plus unrestricted unprivileged
  # user namespaces for G12A clause 3's sandbox-denial proof (the script may not
  # open an imports/ path itself). No Mesa: nothing here renders. G12B's sphere
  # and cylinder fixtures come out of render.tessellate, which is pure OCCT
  # arithmetic over a shape and opens no GL context — and geom.mesh is forbidden
  # from reaching the render package at all (G12A clause 17). No Node: no clause
  # in either suite touches the bridge or the generated contract artifacts,
  # because 12A and 12B add no tool — all five terms are script vocabulary, on
  # the import_step precedent (§7.1). G12C moves the tool pin (53 -> 54 for
  # compare_to_scan, §7.2) and its clauses run the tool through the real
  # dispatcher, but that is a Python surface too: no Node and no browser is
  # involved, and the generated TypeBox module is compared as TEXT against the
  # committed artifact rather than executed. A prerequisite a lane does not need
  # is noise, not safety.
  #
  # G12C additionally grades the scan corpus family's four reference solutions
  # (two tasks x two independent implementations) through the real bench harness,
  # which builds parts — so bubblewrap is load-bearing for this lane in a way it
  # was not for 12A alone.
  #
  # G12A clause 19's performance budget is a CEILING whose constant is DERIVED
  # from the pinned image's own archived measurement
  # (tests/stage12a/evidence/pinned_measurements.json, taken by
  # scripts/stage12_pinned_measure.py, which refuses to write outside a pinned
  # image). Mission rule 4's re-measurement is therefore taken, not owed; the
  # "stage12 measurements (pinned image)" lane below re-takes it with --check on
  # every run, and this lane asserts the ceiling against it.
  #
  # G12B's sew goldens are (container image, OCCT version)-scoped (§8 Tier 3).
  # This lane runs on the stock runner, where the image digest reads "unpinned"
  # and the OCCT version comes from the lockfile's own wheel, so the committed
  # pair matches. Regeneration is HEPHAESTUS_REBASELINE_SEW_GOLDENS-gated and is
  # deliberately NOT set here: a golden that rewrites itself in CI can never
  # fail. The timeout is 45 rather than 30 minutes because G12B clause 22
  # reproduces the §4.2 offset finding, which is a ~31 s kernel call by nature —
  # it is the measurement the whole stage turns on, and it is asserted rather
  # than quoted.
  # G12C clauses 45/46's round-trip constants (MESH_ROUNDTRIP_EPS_MM and
  # MESH_TESSELLATION_VOLUME_BIAS) are DERIVED at import from
  # tests/stage12c/evidence/pinned_measurements.json — the pinned image's own
  # measurement of the loop — rather than transcribed beside a claim about where
  # they came from, and no derived ceiling may exceed the value that stood
  # before the image measured anything. The §6.6 fidelity window is not a
  # measured constant at all: it is LINEAR_DEFLECTION read from tessellate.py,
  # so a change to the pinned deflection moves the window with it. Mission rule
  # 4's re-measurement is taken for all of these, exactly as it is for G12A.19
  # and G12B.25/33 (this comment said the debt was owed until the third repair
  # pass; pinning a sentence that is no longer true is worse than not pinning).
  stages12:
    name: stage gates 12A-12C
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sandbox prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: uv run pytest tests/stage12a tests/stage12b tests/stage12c -q

  # ------------------------------------------------------ stage gates 13A-13C --
  # Gates G13A (pose solving, 17 clauses), G13B (placement proposal, 26) and
  # G13C (parameter space and the corpus half, 13) - SOLVER.md "Gates". Mission
  # rule 1 makes a gate a command, so all three suites run on every PR here
  # rather than on a developer's machine. The lane is RENAMED as each sub-stage
  # lands: a lane naming a suite that does not exist is a red build, not a
  # placeholder.
  #
  # Prerequisites, and why each one: bubblewrap plus unrestricted unprivileged
  # user namespaces, because the surface clauses drive the eight fixture parts
  # through the model's own `build_part` on the real dispatcher, which runs the
  # executor under the sandbox. No Mesa: nothing here renders.
  #
  # The determinism clauses (13A.13, 13B.37, 13C.50) spawn second interpreters
  # and the verification pass (SOLVER.md §7) spawns one per solve, so this lane
  # is process-heavy. 13C is also the first solve suite that spends KERNEL time
  # per iterate - every 2C candidate is a preview build (SOLVER.md §2C) - so the
  # timeout moves from 45 to 75 minutes against the ~20 the three suites take
  # locally. The number is the measurement's, not a guess: a lane that times out
  # is a red build that says nothing about the gate.
  stages13:
    name: stage gates 13A-13C
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sandbox prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: uv run pytest tests/stage13a tests/stage13b tests/stage13c -q

  # ------------------------------------ stage 12 measurements (pinned image) --
  # The lane that RE-TAKES, in the image CI pulls by digest, the four Stage 12
  # measurements whose clauses say "in the pinned image": G12A.19, G12B.25,
  # G12B.33 and G12C.45. Those numbers are already recorded — the committed
  # record is tests/stage12{a,b,c}/evidence/pinned_measurements.json, and the
  # gate suites read it and refuse an unpinned one — so this lane is not a
  # promise to measure later. It is the standing re-measurement that keeps the
  # record true: `scripts/stage12_pinned_measure.py --check` measures afresh
  # here and fails if the committed constants no longer bound this image's own
  # numbers.
  #
  # It runs INSIDE the pinned image by digest, on the pattern the
  # `render goldens (pinned image)` lane established, and exports
  # HEPHAESTUS_CI_IMAGE_DIGEST so anything it records says which world it was
  # recorded in (core/src/hephaestus/core/mesh_solid.py: image_digest()).
  #
  # What it runs, and what each one binds:
  #   G12A.19  the parse + canonicalize + quality budget, whose ceiling
  #            SCAN_BUDGET_S is set from the recorded image measurement;
  #   G12B.25  the ShapeFix experiment, whose §4.5 disposition is asserted from
  #            evidence carrying a pinned (image digest, OCCT version) stamp;
  #   G12B.33  the Tier 3 two-process sew determinism binding — the CROSS-PROCESS
  #            comparison only, which computes both sides inside this run;
  #   G12C.45/46 the §6.6 round-trip constants.
  #
  # HEPHAESTUS_REBASELINE_SEW_GOLDENS is deliberately NOT set: a golden that
  # rewrites itself in CI can never fail. The committed sew goldens carry
  # image_digest "unpinned", so they are valid for the stock lane and NOT for
  # this one — which is exactly what G12B.32 asserts should happen, and why the
  # golden-comparison tests are not selected here. Moving them into the image is
  # a re-baseline PR, not a silent regeneration.
  #
  # It IS in release.yml's prior-gate list, like every other ci.yml job. The
  # earlier draft of this lane argued itself out of that list; tests/stage7h
  # ::test_the_prior_gate_check_names_every_ci_job asserts set equality between
  # ci.yml's published check names and that list, and went red the moment this
  # job was added. Under mission rule 1 the resolution is a tightening, and the
  # argument was wrong on its own terms besides: this lane takes a measurement
  # rather than waiting on one, and a release that ships constants nothing
  # re-measured in the image is exactly the release the list exists to stop.
  stage12-measurements:
    name: stage12 measurements (pinned image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/autonome-research/hephaestus-ci@sha256:94dd58592d531dc6f93a18bb6d0757d553ecea6db29b963c1af38a440d06ce00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --security-opt systempaths=unconfined
        --cap-add SYS_ADMIN
    env:
      CI: "true"
      # The digest above, verbatim. Anything this lane records says so.
      HEPHAESTUS_CI_IMAGE_DIGEST: "sha256:94dd58592d531dc6f93a18bb6d0757d553ecea6db29b963c1af38a440d06ce00"
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --dev
      # The committed record, re-measured against THIS image. --check writes
      # nothing: it takes every measurement again and fails if the recorded
      # numbers the constants are set from no longer hold here. A record that is
      # never re-taken is a number nobody is accountable for.
      - name: the recorded pinned-image measurements still hold
        run: uv run python scripts/stage12_pinned_measure.py --check
      # `-s` on the budget step is deliberate: the test prints the seconds it
      # measured, and the number in this log is what a re-record PR quotes when
      # the image moves. A gate that only says "under the ceiling" cannot set a
      # constant from the image's own measurement.
      # `-k budget` selects BOTH halves of clause 19: the enforcement (the run
      # is under the ceiling) and the provenance (the ceiling is derived from
      # the recorded image measurement). Selecting only the first would run the
      # half that does not need this image.
      - name: G12A.19 — parse + canonicalize + quality budget
        run: uv run pytest tests/stage12a/test_g12a_boundary_cli_and_ceilings.py -k budget -q -s
      - name: G12B.25 — the ShapeFix experiment
        run: uv run pytest tests/stage12b/test_g12b_mesh_to_solid.py -k clause25 -q -s
      # clause 33 only, and not its committed-golden companion: that golden
      # records image_digest "unpinned" and is correctly invalid here.
      - name: G12B.33 — two-process sew determinism
        run: uv run pytest tests/stage12b/test_g12b_goldens_and_determinism.py -k "clause33 and not committed_golden" -q -s
      - name: G12C.45/46 — round-trip identity and fidelity
        run: uv run pytest tests/stage12c/test_g12c_roundtrip.py -q -s
      - name: archive the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-pinned-measurements
          path: |
            tests/stage12a/evidence/
            tests/stage12b/evidence/
            tests/stage12c/evidence/
          if-no-files-found: warn

  # ------------------------------------------------------- server + bridge --
  server:
    name: server (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # inspect_part/query_snapshot render through surfaceless EGL; the DFM
      # predicates are sandboxed registry content and need bubblewrap.
      - name: sandbox + renderer prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      # server/tests is ~769 tests / ~15 min unsharded. Split the test FILES
      # round-robin so every file lands in exactly one shard and the union is
      # the whole suite (no -k filtering, so nothing is silently skipped).
      - name: run shard
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            ls server/tests/test_*.py | sort | awk "NR % 3 == ${{ matrix.shard }}"
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "shard ${{ matrix.shard }} matched no test files" >&2
            exit 1
          fi
          printf 'shard %s: %d files\n' "${{ matrix.shard }}" "${#FILES[@]}"
          uv run pytest "${FILES[@]}" -q

  # ------------------------------------------------------------ agent (node) --
  agent-node:
    name: agent (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent typecheck
      - run: pnpm --dir agent lint
      - run: pnpm --dir agent test

  # The web workspace client (INTERFACE.md §3). Its own package and its own
  # lockfile, driven exactly like `agent/` — there is deliberately no
  # repository-root pnpm workspace, because one would hoist `agent/`'s lockfile
  # and every `pnpm --dir agent install --frozen-lockfile` in these workflows.
  #
  # `pnpm --dir web test:e2e` is NOT here: it is the Gate G4 command and runs
  # in the `render goldens (pinned image)` job above, inside the pinned image
  # (INTERFACE.md §14). This job covers the non-renderer half of web/: unit
  # tests, typecheck, lint, build.
  # ------------------------------------------------ renderer-pinned goldens --
  # The pinned CI container image (docker/ci/Dockerfile, built by ci-image.yml,
  # consumed BY DIGEST — a digest bump here is a renderer re-baseline and lands
  # with regenerated goldens). This job is where the renderer-pinned gates
  # actually run: tests/render (G1 goldens), the G4.7 section golden, and the
  # Gate G4 command `pnpm --dir web test:e2e`. Container options collected from
  # first execution (commit f3a4d42): bwrap needs an unmasked /proc
  # (systempaths=unconfined) plus unconfined seccomp/apparmor for user
  # namespaces; pnpm needs CI=true and a store outside the checkout; git needs
  # safe.directory inside the container.
  render-goldens:
    name: render goldens (pinned image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/autonome-research/hephaestus-ci@sha256:94dd58592d531dc6f93a18bb6d0757d553ecea6db29b963c1af38a440d06ce00
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --security-opt systempaths=unconfined
        --cap-add SYS_ADMIN
    env:
      CI: "true"
      npm_config_store_dir: /tmp/pnpm-store
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image bakes a pnpm; activate the repo-pinned one so every CI job
      # runs the identical version (see the PNPM_VERSION note above).
      - run: corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      - run: pnpm --dir agent build
      # The G4 e2e harness starts a real `heph serve --web`, which refuses
      # without BOTH a staged sidecar (its session routes answer
      # agent_unavailable otherwise) and a built web bundle (it serves the API
      # only otherwise). Same sequence release.yml lane (b) uses.
      - run: pnpm --dir agent run bundle
      - run: uv run python scripts/stage_sidecar.py
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: uv run pytest tests/render -q
      - run: uv run pytest tests/stage4/test_g4_section_golden.py -q
      - run: pnpm --dir web test:e2e

  web-node:
    name: web (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  # ------------------------------------------------------------- stage 7H --
  # The fast half of the Stage 7H suite: sidecar resolution/integrity policy,
  # version coherence, the docs set, the leaderboard page, and the structural
  # assertions over release.yml's lanes (a)-(d). ~6 s.
  #
  # The `slow` half (build every wheel, install into a throwaway venv, spawn the
  # packaged sidecar) is the release matrix's job — release.yml runs it on the
  # built artifact. Running it here too would double every PR's cost to measure
  # a wheel nobody publishes. Deselecting it is therefore deliberate, and the
  # marker name says so.
  stage7h:
    name: stage7h packaging invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --dev
      - run: pnpm --dir agent install --frozen-lockfile
      # The resolver tests assert over a real staged sidecar and its manifest,
      # so the bundle has to exist — a bare checkout has none.
      - name: bundle + stage the sidecar
        run: |
          pnpm --dir agent run bundle
          uv run python scripts/stage_sidecar.py
      - run: uv run pytest tests/stage7h -q -m "not slow"
