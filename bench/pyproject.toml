[project]
name = "hephaestus-bench"
version = "0.1.0"
description = "Tier 3 evaluation: corpus harness, grading, scoring, leaderboard artifacts"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "hephaestus-server",
    # EXTERNAL_EVAL.md §2 (the CADGenBench adapter): the dataset is fetched from
    # the HF hub into an out-of-repo cache, and its per-sample spec is YAML.
    # Package-level only — the engine never sees either.
    "huggingface-hub>=0.26",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

# `bench/results/` and `bench/archive/` are archived run evidence, not package
# payload: hundreds of MB of transcripts, and — because a recorded run captures a
# whole project directory — an absolute `.heph/agent/auth.json` symlink that makes
# the sdist tarball unextractable ("external symlinks are not allowed"). The
# wheel never saw them (they are outside `src/`); only the sdist swept them in.
[tool.hatch.build.targets.sdist]
exclude = ["results", "archive", "corpus"]

[tool.uv.sources]
hephaestus-server = { workspace = true }
