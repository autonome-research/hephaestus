[project]
name = "hephaestus-bench"
version = "0.1.0"
description = "Tier 3 evaluation: corpus harness, grading, scoring, leaderboard artifacts"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "hephaestus-server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

[tool.uv.sources]
hephaestus-server = { workspace = true }
