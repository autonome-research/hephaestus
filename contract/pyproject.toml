[project]
name = "hephaestus-contract"
version = "0.1.0"
description = "Canonical tool-surface contract: typed declarations, codegen, committed schemas"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]
# See hatch_build.py: `hephaestus.contract` reads schemas/bridge_limits.json at
# import time, so the wheel must carry it. `artifacts` overrides VCS ignore
# rules for the staged copy.
artifacts = ["src/hephaestus/contract/_data/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/hephaestus/contract/_data/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
