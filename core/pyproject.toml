[project]
name = "hephaestus-core"
version = "0.1.0"
description = "Hephaestus CAD engine: executor, kernel services, checks, project store"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "build123d>=0.11.1,<0.12",
    "ezdxf>=1.3",
    "numpy>=2.0",
    "opstore",
    "pillow>=10",
    "pygltflib>=1.16",
    "pyrender>=0.1.45",
    "reportlab>=4.2",
    "trimesh>=4.12",
]

[project.scripts]
heph = "hephaestus.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

[tool.uv.sources]
opstore = { workspace = true }
