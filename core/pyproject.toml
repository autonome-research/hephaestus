[project]
name = "hephaestus-core"
version = "0.1.0"
description = "Hephaestus CAD engine: executor, kernel services, checks, project store"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "build123d>=0.11.1,<0.12",
    "ezdxf>=1.3",
    "numpy>=2.0",
    "opstore",
    "pillow>=10",
    "pygltflib>=1.16",
    "pyrender>=0.1.45",
    "reportlab>=4.2",
    # MESH_INGEST.md §6.3 / §12 item 25, under mission rule 7. Direction B of a
    # scan comparison needs a spatial index: BRepExtrema_DistShapeShape measured
    # 54.6 ms/pt against a 4002-face target where a kd-tree query is 0.45 µs/pt,
    # ~120,000x. scipy was ALREADY resolved in this environment as a pyrender
    # requirement, so this pins what is installed rather than admitting a new
    # wheel. `rtree` is deliberately NOT added, so trimesh.proximity.closest_point
    # — which needs it — is not the mechanism.
    "scipy>=1.14",
    "trimesh>=4.12",
]

[project.scripts]
heph = "hephaestus.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]
# `schemas/bridge_limits.json` is the single source of truth for the §5 numeric
# limits — Python, the bridge, and the TypeScript sidecar all read that one file,
# so a cap can never be raised on one side alone. `hephaestus.core.registry`
# reads it at *import* time, so a wheel without it fails on `import
# hephaestus.core`. `hatch_build.py` stages the repo's copy into the package,
# keeping the single-source property through packaging instead of committing a
# second copy under `src/`. `artifacts` overrides the VCS ignore rules for it.
artifacts = ["src/hephaestus/core/_data/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/hephaestus/core/_data/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
opstore = { workspace = true }
