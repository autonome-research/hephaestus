[project]
name = "hephaestus-executor-runtime"
version = "0.1.0"
description = "Minimal Hephaestus build/DFM worker runtime for the OCI executor"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "build123d>=0.11.1,<0.12",
    "ezdxf>=1.3",
    "numpy>=2.0",
    "opstore",
    "scipy>=1.14",
    "trimesh>=4.12",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]
artifacts = ["src/hephaestus/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/hephaestus/**"]
include = [
    "hatch_build.py",
    "pyproject.toml",
    "src/hephaestus/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
opstore = { path = "../../../opstore" }
