[project]
name = "opstore"
version = "0.1.0"
description = "Generic durability substrate: WAL, idempotency, CAS blobs, leases, admission, reachability/GC over SQLite + filesystem"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstore"]
