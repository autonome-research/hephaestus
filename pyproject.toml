[project]
name = "hephaestus-workspace"
version = "0.0.0"
description = "Hephaestus monorepo workspace root (not a published package)"
requires-python = ">=3.11,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "opstore",
    "core",
    "server",
    "contract",
    "bench",
    # The aggregate `hephaestus-cad` release distribution (Stage 7H).
    "packaging",
]

[dependency-groups]
dev = [
    "opstore",
    "hephaestus-cad",
    "hephaestus-core",
    "hephaestus-server",
    "hephaestus-contract",
    "hephaestus-bench",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "jsonschema>=4.23",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "scikit-image>=0.26",
    "pypdf>=5.1",
]

[tool.uv.sources.hephaestus-cad]
workspace = true

[tool.uv.sources.hephaestus-core]
workspace = true

[tool.uv.sources.hephaestus-server]
workspace = true

[tool.uv.sources.hephaestus-contract]
workspace = true

[tool.uv.sources.hephaestus-bench]
workspace = true

[tool.uv.sources]
opstore = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# spikes/ is frozen Stage S evidence; corpus/ and registries/ hold part
# scripts written against the executor's injected namespace, not importable
# Python modules. tests/stage3/fixtures/ is recorded session evidence in the
# same category: verbatim model-authored part scripts, not project source, as is
# server/tests/fixtures/ (the recorded bracket-101 seed-2 failure the Stage 2V
# critique tests assert over — reformatting it would edit the evidence).
extend-exclude = [
    "bench",
    "spikes",
    "corpus",
    "registries",
    "tests/stage3/fixtures",
    "server/tests/fixtures",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["opstore", "core", "server", "contract", "bench/src"]
# server/tests/fixtures/ is recorded model-authored part-script evidence written
# against the executor's injected namespace, not importable project source (same
# category as tests/stage3/fixtures/, which pyright never sees because it is
# outside `include`).
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "server/tests/fixtures",
    # Hatchling build hooks. They import `hatchling.builders.*`, which exists
    # only inside the isolated build environment the backend creates — it is not
    # (and must not become) a dev dependency of the project itself, so pyright
    # has no stubs to resolve the base class against.
    "*/hatch_build.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[[tool.pyright.executionEnvironments]]
root = "core/src/hephaestus/core/kernel"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "core/src/hephaestus/core/executor"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "core/src/hephaestus/core/render"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["opstore/tests", "tests"]
addopts = "-ra"
markers = [
    # Stage 7H packaging lanes: build every wheel and install into a fresh venv.
    # Minutes, not seconds — but they MUST run locally, so they are marked, not
    # skipped by default. Deselect with `-m "not slow"`.
    "slow: builds artifacts or provisions an environment (Stage 7H wheel lanes)",
]
