[project]
name = "hephaestus-workspace"
version = "0.0.0"
description = "Hephaestus monorepo workspace root (not a published package)"
requires-python = ">=3.11,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "opstore",
]

[dependency-groups]
dev = [
    "opstore",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv.sources]
opstore = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["opstore"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["opstore/tests", "tests"]
addopts = "-ra"
