[pack]
process = "cnc_mill"
name = "CNC milling (3-axis, part in the vise)"
version = "0.1.0"
description = """
Limits imposed by cutting bar and plate with a spinning end mill from a single
+Z spindle on a 3-axis vertical mill. The bit cannot turn a corner tighter
than its own radius, a pocket deeper than a few diameters chatters at the
declared chipload, a web thinner than about a millimetre distorts, a bore much
deeper than it is wide wanders, and a feature whose approach axis is not the
spindle cannot be reached without a second setup. All of that is measurable on
the built solid.

Where the resolved materials record declares a machining block (CAM.md §6.2),
its numbers govern: min_internal_radius_mm, max_depth_diameter_ratio and
min_web_mm are read from the material's declared machining numbers when
present, and from this pack's [params] otherwise — never from the notes prose.

Defaults are a common 3 mm two-flute carbide in 6061 plate on a benchtop mill.
Override them by publishing a fork of this pack with your own [params]; the
rules read only the parameters they declare, so a re-tuned pack is a data
change, not a code change.

This pack does not declare kerf_mm: a mill bit removes its full diameter, and
cut-file kerf compensation is a laser/waterjet concern.
"""

[params.tool_diameter_mm]
value = 3.0
unit = "mm"
description = "Smallest cutter the shop will put in the spindle (the bit the rules design to)."

[params.min_internal_radius_mm]
value = 1.5
unit = "mm"
description = "Tightest internal corner radius: half the tool diameter, unless the material's machining block declares otherwise."

[params.max_depth_diameter_ratio]
value = 4.0
unit = "x diameter"
description = "Deepest pocket as a multiple of the tool diameter before chatter; the material's machining block overrides."

[params.min_web_mm]
value = 1.0
unit = "mm"
description = "Thinnest remaining wall that will not distort under the cut; the material's machining block overrides."

[params.max_bore_aspect]
value = 6.0
unit = "x diameter"
description = "Deepest bore as a multiple of its diameter before the bit wanders."

[params.chipload_mm]
value = 0.05
unit = "mm/tooth"
description = "Declared chipload the depth-to-diameter limit is characterised at."

[params.feed_mm_min]
value = 900.0
unit = "mm/min"
description = "Declared feed the depth-to-diameter limit is characterised at (3 mm, 2 flute, ~9k rpm in 6061)."

[params.approach_axis_tol_deg]
value = 5.0
unit = "deg"
description = "How far a feature axis may lean from the +Z spindle and still count as reachable in one setup."

[[rules]]
id = "cnc_mill.min_internal_radius_vs_tool"
title = "Internal corners must not be tighter than the bit radius"
severity = "error"
predicate = "min_internal_radius_vs_tool.py"
reads = ["tool_diameter_mm", "min_internal_radius_mm"]
description = """
Measures each concave corner round in the part. An end mill cannot produce a
corner tighter than its own radius, so an internal round below the larger of
the declared floor and half the tool diameter is cut as a larger radius than
modelled — parts that depend on the corner for fit will not assemble. The
floor is the material's declared machining.min_internal_radius_mm when the
resolved record carries one, else this pack's parameter.
"""

[[rules]]
id = "cnc_mill.pocket_depth_vs_tool_diameter"
title = "Pockets must not be deeper than the bit can cut without chatter"
severity = "error"
predicate = "pocket_depth_vs_tool_diameter.py"
reads = ["tool_diameter_mm", "max_depth_diameter_ratio", "chipload_mm", "feed_mm_min"]
description = """
Finds the deepest recessed +Z face (a pocket floor under the stock top) and
compares its depth with the tool diameter times the declared ratio — the
material's machining.max_depth_diameter_ratio when the resolved record carries
one, else this pack's parameter. Past that the flute is buried, chips stop
clearing, and the cut chatters at the declared chipload. A shop question made
measurable — not a feeds-and-speeds model.
"""

[[rules]]
id = "cnc_mill.min_web_thickness"
title = "Remaining walls must be thick enough not to distort under the cut"
severity = "error"
predicate = "min_web_thickness.py"
reads = ["min_web_mm"]
description = """
Finds each solid's thinnest wall by pairing anti-parallel planar faces that
actually face each other, and compares it with the declared web floor — the
material's machining.min_web_mm when the resolved record carries one, else
this pack's parameter. Reports the thinnest wall per solid — the one that
governs — rather than every pair.
"""

[[rules]]
id = "cnc_mill.bore_aspect_ratio"
title = "Bores must not be much deeper than they are wide"
severity = "error"
predicate = "bore_aspect_ratio.py"
reads = ["max_bore_aspect"]
description = """
Measures every closed bore's depth (from the cylindrical face area) against
its diameter. A hole several diameters deep wanders, packs chips, and is not
the hole that was modelled.
"""

[[rules]]
id = "cnc_mill.single_axis_accessibility"
title = "Features must be reachable from the +Z spindle in one setup"
severity = "error"
predicate = "single_axis_accessibility.py"
reads = ["approach_axis_tol_deg"]
description = """
A 3-axis mill holds the part in the vise and approaches from +Z. A hole whose
axis is not parallel to that spindle, or a downward-facing face that is not
the base sitting on the parallels, cannot be cut without a second setup. This
is a static predicate over one artifact — no stock body, no fixture, no
sequence — written from planar_faces() and holes() only (CAM.md §6.2).
"""
