[pack]
process = "fdm"
name = "Fused deposition modelling"
version = "0.1.0"
description = """
Limits imposed by extruding plastic through a round nozzle, layer on layer. A
wall thinner than a small number of extrusion widths has no perimeters to make
it from; material laid beyond the layer below it droops; and a bore printed
smaller than a few nozzle widths closes up. All three are measurable on the
built solid, so they are checked rather than remembered.

The build direction is +Z: faces resting on the plate are supported by
definition and are never reported as overhangs.
"""

[params.nozzle_mm]
value = 0.4
unit = "mm"
description = "Nozzle diameter — one extrusion width."

[params.min_wall_mm]
value = 1.2
unit = "mm"
description = "Absolute floor on a printable wall (three 0.4 mm perimeters)."

[params.wall_nozzle_multiple]
value = 2.0
unit = "x nozzle"
description = "Minimum wall expressed as a multiple of the extrusion width."

[params.max_overhang_deg]
value = 45.0
unit = "deg"
description = "Steepest overhang from vertical that prints without support."

[params.min_overhang_area_mm2]
value = 1.0
unit = "mm^2"
description = "Ignore unsupported faces smaller than this (chamfer slivers)."

[params.min_hole_diameter_mm]
value = 2.0
unit = "mm"
description = "Smallest bore that survives printing without closing up."

[[rules]]
id = "fdm.min_wall_thickness"
title = "Walls must be thick enough to build from whole extrusions"
severity = "error"
predicate = "min_wall_thickness.py"
reads = ["nozzle_mm", "min_wall_mm", "wall_nozzle_multiple"]
description = """
Finds each solid's thinnest wall by pairing anti-parallel planar faces that
actually face each other, and compares it with the larger of the absolute floor
and the nozzle multiple. Reports the thinnest wall per solid — the one that
governs — rather than every pair, so the finding names the place to fix.
"""

[[rules]]
id = "fdm.overhang_angle"
title = "Unsupported faces must not lean past the overhang limit"
severity = "warning"
predicate = "overhang_angle.py"
reads = ["max_overhang_deg", "min_overhang_area_mm2"]
description = """
Measures every downward-facing face's angle from vertical: 0 deg for a vertical
wall, 90 deg for a horizontal bridge. Faces resting on the build plate are
supported and excluded, as are slivers below the area floor. A warning, not an
error: support material is a legitimate answer, but it should be a decision.
"""

[[rules]]
id = "fdm.min_hole_diameter"
title = "Bores must be large enough to print open"
severity = "error"
predicate = "min_hole_diameter.py"
reads = ["min_hole_diameter_mm", "nozzle_mm"]
description = """
Measures every closed bore against the larger of the absolute floor and two
extrusion widths. Below that the perimeters of the bore merge and it prints
solid — and a hole that has to be drilled afterwards is not the hole that was
modelled.
"""
