[pack]
process = "laser_cut"
name = "Laser cutting (sheet)"
version = "0.1.0"
description = """
Limits imposed by cutting flat stock with a beam of finite width. The beam
removes a kerf of material and cannot turn a corner tighter than its own
radius, so the smallest hole, the tightest internal corner, and the sheet
thickness the design assumes are all checkable against the machine and the
stock the materials registry actually carries.

Defaults are a common CO2 laser on thin plywood/acrylic. Override them by
publishing a fork of this pack with your own [params]; the rules read only the
parameters they declare, so a re-tuned pack is a data change, not a code change.
"""

[params.kerf_mm]
value = 0.2
unit = "mm"
description = "Width of material the beam removes on a straight cut."

[params.min_feature_kerf_multiple]
value = 3.0
unit = "x kerf"
description = "Smallest cut feature expressed as a multiple of the kerf."

[params.min_feature_mm]
value = 0.8
unit = "mm"
description = "Absolute floor on a cut feature, whatever the kerf allows."

[params.min_internal_radius_mm]
value = 0.5
unit = "mm"
description = "Tightest internal corner radius the beam can produce cleanly."

[params.thickness_tolerance_mm]
value = 0.2
unit = "mm"
description = "Allowed difference between modelled and nominal stock thickness."

[[rules]]
id = "laser_cut.min_feature_vs_kerf"
title = "Cut features must be wider than the kerf can produce"
severity = "error"
predicate = "min_feature_vs_kerf.py"
reads = ["kerf_mm", "min_feature_kerf_multiple", "min_feature_mm"]
description = """
Measures every closed bore in the part and compares its diameter with the
smallest feature the beam can cut: the larger of the absolute floor and the
kerf multiple. A bore below that either does not cut at all or closes up as
slag.
"""

[[rules]]
id = "laser_cut.min_internal_radius"
title = "Internal corners must not be tighter than the beam radius"
severity = "error"
predicate = "min_internal_radius.py"
reads = ["min_internal_radius_mm", "kerf_mm"]
description = """
Measures each concave corner round in the part. The beam cannot produce a
corner tighter than its own radius, so an internal round below the limit is
cut as a larger radius than modelled — parts that depend on the corner for fit
will not assemble.
"""

[[rules]]
id = "laser_cut.sheet_thickness_match"
title = "Modelled sheet thickness must match a stock thickness the material carries"
severity = "error"
predicate = "sheet_thickness_match.py"
reads = ["thickness_tolerance_mm"]
description = """
Joins the part's measured sheet thickness (its smallest bounding-box extent) to
the materials-registry record its part.material_spec resolves to, and checks
that the thickness is a stock size that material is actually sold in and that
part.stock_form is a form it comes in. A 5.5 mm modelled panel in a material
stocked at 3/6/12/18 mm is a tab-and-slot design that will not assemble.
"""
