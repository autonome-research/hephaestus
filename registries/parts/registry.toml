[registry]
name = "hephaestus-parts"
kind = "parts"
version = "0.1.0"
license = "Apache-2.0"
description = """
Metric-hardware parts store: socket-head cap screws and heat-set inserts as
thread-free DIN/nominal envelopes, plus the mechanism components a bearing
seat, a motor mount or a gear train is built against — all of them
standard-derived envelopes with tagged mounting interfaces. Every generator is
an ordinary part script and executes only under the secure sandbox. Nothing
here transcribes a vendor drawing or redistributes a vendor payload
(PARTS_STORE.md §7).
"""

