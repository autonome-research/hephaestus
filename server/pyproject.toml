[project]
name = "hephaestus-server"
version = "0.1.0"
description = "Hephaestus agent bridge/supervisor (Stage 2) and MCP/HTTP server (Stage 3)"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.4,<4",
    "hephaestus-contract",
    "hephaestus-core",
    "mcp>=1.28",
    "opstore",
    # INGEST.md §2: PDF reference text extraction. Server-side only — the core
    # engine stores and reads the extracted text without any parser.
    "pypdf>=5.1",
    # INTERFACE.md §2: `server/http` (the Stage 4 web workspace API) and its
    # loopback server. Both already arrive transitively as what `fastmcp` serves
    # streamable HTTP on; they are declared here because this package now imports
    # them directly, and an undeclared transitive import is a dependency that
    # disappears the day fastmcp changes its own. No FastAPI: §2 names no
    # framework, and a second web framework in one process buys nothing.
    "starlette>=0.47,<2",
    "uvicorn>=0.34,<1",
    # INTERFACE.md §2.7's `GET /events` is a WebSocket, which uvicorn serves only
    # with a ws implementation present, and `heph agent` client mode needs a
    # WebSocket *client*. Already in the graph via fastmcp; declared because we
    # import and depend on it directly.
    "websockets>=13,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]
# The bundled Node sidecar is build output (gitignored), so hatchling's default
# VCS-aware file selection would silently drop it and ship a wheel whose
# `heph agent` cannot start. `artifacts` overrides the ignore rules for exactly
# this tree; `hatch_build.py` then refuses to build at all if it is absent or
# fails its integrity manifest.
artifacts = ["src/hephaestus/agent_bridge/_sidecar/**"]

# Declared explicitly for the sdist too: `uv build` produces an sdist and then
# builds the wheel *from that sdist*, so a sidecar that reaches the sdist only
# by inheritance is a wheel that fails to build the moment the inheritance
# changes.
[tool.hatch.build.targets.sdist]
artifacts = ["src/hephaestus/agent_bridge/_sidecar/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
hephaestus-contract = { workspace = true }
hephaestus-core = { workspace = true }
opstore = { workspace = true }
