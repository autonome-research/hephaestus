[project]
name = "hephaestus-server"
version = "0.1.0"
description = "Hephaestus agent bridge/supervisor (Stage 2) and MCP/HTTP server (Stage 3)"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.4,<4",
    "hephaestus-contract",
    "hephaestus-core",
    "mcp>=1.28",
    "opstore",
    # INGEST.md §2: PDF reference text extraction. Server-side only — the core
    # engine stores and reads the extracted text without any parser.
    "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

[tool.uv.sources]
hephaestus-contract = { workspace = true }
hephaestus-core = { workspace = true }
opstore = { workspace = true }
