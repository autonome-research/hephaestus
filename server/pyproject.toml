[project]
name = "hephaestus-server"
version = "0.1.0"
description = "Hephaestus agent bridge/supervisor (Stage 2) and MCP/HTTP server (Stage 3)"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
    "hephaestus-core",
    "opstore",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hephaestus"]

[tool.uv.sources]
hephaestus-core = { workspace = true }
opstore = { workspace = true }
