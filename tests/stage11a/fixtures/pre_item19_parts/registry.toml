id = "heatset_insert_m4"
dir = "heatset_insert_m4"

[[parts]]
id = "heatset_insert_m5"
dir = "heatset_insert_m5"

[[parts]]
id = "screw_socket_head_m3"
dir = "screw_socket_head_m3"

[[parts]]
id = "screw_socket_head_m4"
dir = "screw_socket_head_m4"

[[parts]]
id = "screw_socket_head_m5"
dir = "screw_socket_head_m5"
