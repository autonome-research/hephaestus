[registry]
name = "hephaestus-parts"
kind = "parts"
version = "0.1.0"
license = "Apache-2.0"
description = """
Minimal metric-hardware parts store: socket-head cap screws and heat-set
inserts as thread-free DIN/nominal envelopes. Every generator is an ordinary
part script and executes only under the secure sandbox.
"""

[[parts]]
id = "heatset_insert_m3"
dir = "heatset_insert_m3"

