    <!--
      The bearer token rides in the URL fragment (INTERFACE.md §2.2). A fragment
      is never sent to a server, but it IS sent in a `Referer` by some
      navigations; `no-referrer` closes that last path. There is nothing else on
      this origin to refer to anyway - architecture.md §7 is loopback only.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>Hephaestus workspace</title>
  </head>
